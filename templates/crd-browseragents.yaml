{{- if .Values.installCRDs }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: browseragents.livellm.io
spec:
  group: livellm.io
  names:
    kind: BrowserAgent
    listKind: BrowserAgentList
    plural: browseragents
    shortNames:
    - ba
    singular: browseragent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.model.provider
      name: Provider
      type: string
    - jsonPath: .status.resolvedWsUrl
      name: Target
      priority: 1
      type: string
    - jsonPath: .status.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BrowserAgent is the Schema for the browseragents API.
          Each BrowserAgent CR deploys a livellm-agent runtime that drives a Browser
          (directly or via a Controller) to complete tasks as reviewable trajectories.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BrowserAgentSpec defines the desired state of a BrowserAgent.
            properties:
              artifacts:
                description: Artifacts configures where run video + trajectory JSON
                  are stored.
                properties:
                  accessKeySecret:
                    description: AccessKeySecret / SecretKeySecret reference the S3
                      credential Secret keys.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  bucket:
                    description: Bucket holds run artifacts. Defaults to "browser-agent".
                    type: string
                  endpoint:
                    description: Endpoint is the S3-compatible endpoint (e.g. http://minio.minio:9000).
                    type: string
                  secretKeySecret:
                    description: SecretKeySelector selects a key of a Secret.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              control:
                description: Control configures the live review/control channel.
                properties:
                  tokenSecret:
                    description: TokenSecret references the Secret key holding the
                      control-channel token.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  url:
                    description: URL is the gateway websocket base (e.g. wss://<gateway>/agent/...).
                    type: string
                type: object
              env:
                description: Env is a list of extra environment variables for the
                  agent container.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: Name of the environment variable. Must be a C_IDENTIFIER.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              image:
                description: 'Image overrides the agent container image (default:
                  DEFAULT_AGENT_IMAGE).'
                type: string
              imagePullSecrets:
                description: ImagePullSecrets are names of Secrets used to pull the
                  (private) agent image.
                items:
                  type: string
                type: array
              model:
                description: Model is the tenant's AI provider for the agent's brain
                  (REQUIRED at run time).
                properties:
                  apiKeySecret:
                    description: |-
                      APIKeySecret references the Secret key holding the provider API key. It is
                      injected into the pod via secretKeyRef and held only for the run.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  baseUrl:
                    description: BaseURL optionally overrides the provider endpoint
                      (proxy / compatible API).
                    type: string
                  name:
                    description: Name is the model id (a vision-capable model is preferred).
                    type: string
                  provider:
                    description: 'Provider is the LLM provider: anthropic | openai
                      | openai-compatible | google.'
                    type: string
                required:
                - provider
                type: object
              podLabels:
                additionalProperties:
                  type: string
                description: |-
                  PodLabels are extra labels stamped onto the agent pods (not the Deployment
                  or the selector). General-purpose passthrough.
                type: object
              recording:
                description: Recording toggles run video capture.
                properties:
                  enabled:
                    default: true
                    type: boolean
                type: object
              resources:
                description: Resources defines CPU/memory requests and limits for
                  the agent pod.
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    description: Limits describes the maximum resources allowed.
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    description: Requests describes the minimum resources required.
                    type: object
                type: object
              running:
                description: |-
                  Running controls whether the agent runtime is up. When false, the
                  Deployment is scaled to zero. Omitted ⇒ true.
                type: boolean
              target:
                description: Target selects the browser to drive over CDP.
                properties:
                  browserId:
                    description: |-
                      BrowserID is the registered browser_id (profileUid) to drive when
                      ControllerRef is set. Defaults to the only browser if the controller has one.
                    type: string
                  browserRef:
                    description: BrowserRef is an in-namespace Browser CR name (plain
                      CDP).
                    type: string
                  controllerRef:
                    description: |-
                      ControllerRef is an in-namespace Controller CR name. When set, the agent
                      resolves the CDP endpoint via the controller and registers its
                      search/content/interact/attribute endpoints as tools.
                    type: string
                  externalWsUrl:
                    description: ExternalWsURL is a BYO/remote CDP websocket endpoint
                      (ws:// or wss://).
                    type: string
                type: object
            required:
            - model
            - target
            type: object
          status:
            description: BrowserAgentStatus defines the observed state of a BrowserAgent.
            properties:
              controlUrl:
                description: ControlURL echoes spec.control.url for the UI to connect
                  to.
                type: string
              message:
                description: Message is a human-readable status message.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Pending
                - Creating
                - Running
                - Failed
                - Stopped
                type: string
              podName:
                description: PodName is the name of a running agent pod.
                type: string
              resolvedWsUrl:
                description: ResolvedWsURL is the CDP endpoint the agent was wired
                  to drive.
                type: string
              url:
                description: |-
                  URL is the in-cluster base URL for the agent API (e.g. http://name.ns:8800).
                  POST <url>/act launches a task.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
