{{- /*
Copied from livellm-browser-operator deploy/crd.yaml; tests/render-test.sh
with OPERATOR_CRD compares the two.

Rollback hazard: never revert this chart below the Browser CRD carrying
spec.engine while any Browser with engine camoufox exists. Without the
property the apiserver prunes spec.engine on every read, so the operator
renders those browsers as Chrome on a Firefox profile disk. Stop or delete
the Camoufox browsers first.
*/}}
{{- if .Values.installCRDs }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: browsers.livellm.io
spec:
  group: livellm.io
  names:
    kind: Browser
    listKind: BrowserList
    plural: browsers
    shortNames:
    - br
    singular: browser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileUid
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.wsUrl
      name: WS URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Browser is the Schema for the browsers API.
          Each Browser CR results in one browser pod with a persistent profile.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BrowserSpec defines the desired state of a Browser instance.
            properties:
              control:
                description: |-
                  Control adds the control sidecar to the browser pod: it holds proxy logins,
                  serves profile snapshots and, whenever spec.proxy is also set, runs a relay
                  that passes no traffic until its config arrives. It reads its settings from
                  the named Secret, which is mounted into the sidecar only. When omitted, the
                  pod is rendered without it.
                properties:
                  secretName:
                    description: |-
                      SecretName is the Secret in the Browser's namespace that holds the
                      sidecar's key, config and proxy logins. Only the sidecar mounts it.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - secretName
                type: object
              cookies:
                description: |-
                  Cookies loads a JSON array of cookies from a ConfigMap or Secret
                  and injects them into the browser at creation time.
                properties:
                  configMapRef:
                    description: ConfigMapRef references a ConfigMap key containing
                      a JSON array of cookies.
                    properties:
                      key:
                        default: cookies.json
                        description: Key within the resource. Defaults to "cookies.json".
                        type: string
                      name:
                        description: Name of the ConfigMap or Secret.
                        type: string
                    required:
                    - name
                    type: object
                  secretRef:
                    description: SecretRef references a Secret key containing a JSON
                      array of cookies.
                    properties:
                      key:
                        default: cookies.json
                        description: Key within the resource. Defaults to "cookies.json".
                        type: string
                      name:
                        description: Name of the ConfigMap or Secret.
                        type: string
                    required:
                    - name
                    type: object
                type: object
              engine:
                description: |-
                  Engine is the browser engine: chrome or camoufox. Absent means chrome.
                  It is set at creation by the platform and does not change afterwards.
                enum:
                - chrome
                - camoufox
                type: string
              env:
                description: Env is a list of environment variables injected into
                  the browser container.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: Name of the environment variable. Must be a C_IDENTIFIER.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              extensions:
                description: |-
                  Extensions is a list of Chrome Web Store extension IDs to install at creation time.
                  The launcher downloads and injects them into the profile before Chrome starts.
                  A camoufox browser takes no extensions: the field is ignored there.
                items:
                  type: string
                type: array
              image:
                description: |-
                  Image overrides the browser container image.
                  If empty, the operator uses its configured default (DEFAULT_BROWSER_IMAGE,
                  or DEFAULT_CAMOUFOX_IMAGE for a camoufox browser).
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector restricts which nodes the browser pod may run on (a plain
                  passthrough to the pod's nodeSelector). Empty by default.
                type: object
              podLabels:
                additionalProperties:
                  type: string
                description: |-
                  PodLabels are extra labels stamped onto the workload pods (not the
                  Deployment or the selector). General-purpose passthrough — e.g. set
                  istio.io/dataplane-mode=none to keep a pod out of the ambient mesh, or a
                  marker label whose change forces a clean rollout. Empty by default.
                type: object
              profileUid:
                description: |-
                  ProfileUID is the unique profile identifier used as browser_id in the controller.
                  Defaults to the CR name if empty.
                type: string
              proxy:
                description: |-
                  Proxy configures the HTTP proxy for the browser. Passed to the pod as
                  BROWSER_PROXY_* env and applied to the default browser at startup.
                  A username or password set here reaches the browser container as env and is
                  readable by anyone who can connect to the browser.
                properties:
                  bypass:
                    description: Bypass is a comma-separated list of hosts to bypass.
                    type: string
                  password:
                    description: Password for proxy authentication.
                    type: string
                  server:
                    description: Server is the proxy URL (e.g. http://proxy:8080).
                    type: string
                  username:
                    description: Username for proxy authentication.
                    type: string
                required:
                - server
                type: object
              reclaimPolicy:
                default: Retain
                description: |-
                  ReclaimPolicy determines what happens to the PVC when the Browser CR is deleted.
                  "Retain" (default) keeps profile data; "Delete" removes it.
                enum:
                - Retain
                - Delete
                type: string
              resources:
                description: Resources defines CPU/memory requests and limits for
                  the browser pod.
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    description: Limits describes the maximum resources allowed.
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    description: Requests describes the minimum resources required.
                    type: object
                type: object
              running:
                description: |-
                  Running controls whether the browser workload is up. When false, the Deployment is scaled to zero (PVC retained).
                  When omitted, the controller treats it as true.
                type: boolean
              shmSize:
                default: 4Gi
                description: ShmSize is the /dev/shm size for Chrome (e.g. "4Gi").
                type: string
              storage:
                default: 1Gi
                description: Storage is the PVC size for profile data (e.g. "1Gi").
                type: string
            required:
            - profileUid
            type: object
            x-kubernetes-validations:
            - message: a browser's engine can't change after creation
              rule: '(has(self.engine) ? self.engine : ''chrome'') == (has(oldSelf.engine)
                ? oldSelf.engine : ''chrome'')'
          status:
            description: BrowserStatus defines the observed state of a Browser.
            properties:
              message:
                description: Message is a human-readable status message.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Creating
                - Running
                - Stopped
                type: string
              podName:
                description: PodName is the name of the running browser pod.
                type: string
              wsUrl:
                description: |-
                  WsURL is the browser's automation WebSocket URL: for chrome the CDP URL
                  ws://<name>.<namespace>.svc.cluster.local:9222/devtools/browser/<id>, for
                  camoufox the Playwright URL
                  ws://<name>.<namespace>.svc.cluster.local:9222/playwright/default
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
